services:
  - type: web
    name: securerag-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # Neon PostgreSQL (asyncpg). Paste the full URL in the Render dashboard.
      - key: DATABASE_URL
        sync: false

      # Render can generate this on first blueprint sync.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # The frontend (vercel.app) and backend (onrender.com) are cross-site,
      # so the session cookie must be SameSite=None; Secure.
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        sync: false

      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: securerag

      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: EMBEDDING_DIM
        value: "384"

      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_TIMEOUT_SECONDS
        value: "30"

      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: RATE_LIMIT_LOGIN_ATTEMPTS
        value: "5"
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        value: "60"
      - key: RETRIEVAL_MODE
        value: hybrid
