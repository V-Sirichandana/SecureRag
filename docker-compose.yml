# Local development services for SecureRAG.
# PostgreSQL/Redis are configured separately (see backend/.env); this file
# only provides the vector database used by document ingestion.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      # Bind to loopback only: local development needs the backend on this
      # host, and Qdrant must never be reachable from the network in this
      # compose file. Use a private network / firewall in production.
      - "127.0.0.1:6333:6333" # HTTP API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
