# Local development services for SecureRAG.
# PostgreSQL/Redis are configured separately (see backend/.env); this file
# only provides the vector database used by document ingestion.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
